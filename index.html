

<!DOCTYPE html>

<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#06111f">

<title>A.R.A.X. AI</title>

<style>

*{box-sizing:border-box}

body{

 margin:0;

 background:#06111f;

 color:white;

 font-family:Arial,sans-serif;

}

.app{

 height:100dvh;

 max-width:750px;

 margin:auto;

 display:flex;

 flex-direction:column;

 padding:18px;

}

header{

 display:flex;

 justify-content:space-between;

 align-items:center;

 color:#55d9ff;

}

.logo{

 font-size:26px;

 font-weight:bold;

 letter-spacing:3px;

}

.status{font-size:12px;color:#54ffa7}

.hero{text-align:center;padding:22px 0}

.orb{

 width:115px;height:115px;

 border:4px solid #43d9ff;

 border-radius:50%;

 margin:auto;

 display:grid;

 place-items:center;

 box-shadow:0 0 35px #168dce;

 font-size:37px;

 font-weight:bold;

 color:#b4f4ff;

}

h1{margin-bottom:5px}

.subtitle{font-size:12px;color:#87b9d0}

.chat{

 flex:1;

 overflow-y:auto;

 padding:15px;

 border:1px solid #24465f;

 border-radius:15px;

 background:#091b2d;

}

.message{

 padding:12px;

 border-radius:12px;

 margin-bottom:12px;

 line-height:1.5;

 overflow-wrap:anywhere;

}

.ai{background:#153650}

.user{background:#164f76;margin-left:25px}

.controls{

 display:flex;

 gap:8px;

 padding-top:15px;

}

input{

 flex:1;

 min-width:0;

 padding:14px;

 border:1px solid #2d6b91;

 border-radius:12px;

 background:#10283c;

 color:white;

 font-size:16px;

}

button{

 background:#00a9e8;

 color:white;

 border:0;

 border-radius:12px;

 padding:12px 15px;

 font-size:17px;

 cursor:pointer;

}

.options{

 display:flex;

 justify-content:center;

 gap:10px;

 padding:10px;

}

.options button{

 font-size:12px;

 background:#17374d;

}

footer{

 text-align:center;

 font-size:11px;

 color:#7194aa;

 padding:6px;

}

</style>

</head>

<body>

<div class="app">

<header>

 <div class="logo">A.R.A.X.</div>

 <div class="status">● SYSTEM ONLINE</div>

</header>

<section class="hero">

 <div class="orb">AX</div>

 <h1>A.R.A.X. AI</h1>

 <div class="subtitle">

 ADVANCED ROBOTIC ASSISTANT X

 </div>

</section>

<main class="chat" id="chat" aria-live="polite">

 <div class="message ai">

 A.R.A.X. activated. All systems operational.

 How may I assist you?

 </div>

</main>

<div class="options">

 <button onclick="toggleVoice()" id="voice">

 🔊 Voice ON

 </button>

 <button onclick="clearChat()">Clear Chat</button>

</div>

<div class="controls">

 <button onclick="listen()" aria-label="Microphone">🎙️</button>

 <input id="input" placeholder="Ask A.R.A.X. anything...">

 <button onclick="send()">➤</button>

</div>

<footer>ARAX SYSTEMS • DEMO MODE</footer>

</div>

<script>

const chat=document.getElementById("chat");

const input=document.getElementById("input");

let voiceOn=true;

function addMessage(message,type){

 const div=document.createElement("div");

 div.className="message "+type;

 div.textContent=message;

 chat.appendChild(div);

 chat.scrollTop=chat.scrollHeight;

}

function speak(text){

 if(!voiceOn || !("speechSynthesis" in window))return;

 speechSynthesis.cancel();

 const speech=new SpeechSynthesisUtterance(text);

 speech.rate=0.95;

 speech.pitch=0.85;

 speechSynthesis.speak(speech);

}

function reply(question){

 const q=question.toLowerCase();

 if(q.includes("hello")||q.includes("hi"))

  return "Greetings. A.R.A.X. at your service.";

 if(q.includes("your name"))

  return "I am A.R.A.X., Advanced Robotic Assistant X.";

 if(q.includes("who made you"))

  return "I was created for ARAX Systems.";

 if(q.includes("time"))

  return "The time is "+new Date().toLocaleTimeString();

 if(q.includes("date"))

  return "Today is "+new Date().toLocaleDateString();

 if(q.includes("status"))

  return "All local demo systems are operational.";

 if(q.includes("joke"))

  return "Why did the robot go to school? To improve its processing skills.";

 return "Demo mode active. Connect an AI backend to answer more questions.";

}

function send(){

 const question=input.value.trim();

 if(!question)return;

 addMessage(question,"user");

 input.value="";

 const answer=reply(question);

 addMessage(answer,"ai");

 speak(answer);

}

input.addEventListener("keydown",e=>{

 if(e.key==="Enter")send();

});

function toggleVoice(){

 voiceOn=!voiceOn;

 document.getElementById("voice").textContent=

 voiceOn?"🔊 Voice ON":"🔇 Voice OFF";

 if(!voiceOn && "speechSynthesis" in window)

  speechSynthesis.cancel();

}

function clearChat(){

 chat.replaceChildren();

 addMessage("A.R.A.X. ready for new commands.","ai");

}

function listen(){

 const Recognition=window.SpeechRecognition||

 window.webkitSpeechRecognition;

 if(!Recognition){

  addMessage("Microphone recognition is not supported in this browser. Please type your message.","ai");

  return;

 }

 const recognition=new Recognition();

 recognition.lang="en-US";

 recognition.onresult=e=>{

  input.value=e.results[0][0].transcript;

  send();

 };

 recognition.onerror=()=>{

  addMessage("Microphone unavailable. Try typing instead.","ai");

 };

 recognition.start();

}

</script>

</body>

</html>
